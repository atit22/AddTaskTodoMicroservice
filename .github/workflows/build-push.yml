name: build and push

on:
  workflow_dispatch: 

permissions: 
 contents: read
 id-token: write

jobs:
  build-and-push:
   runs-on: ubuntu-latest
   env:
      IMAGE_NAME: addtask
      IMAGE_TAG: ${{ github.run_number }}
      ACR_NAME: acr222
      ACR_LOGIN_SERVER: acr222.azurecr.io
   environment: qa
   steps:
   - name: Checkout
     uses: actions/checkout@v7.0.0
   - name: Azure Login
     uses: Azure/login@v3
     with:
          client-id: 49f815ef-c5cb-4376-855a-c61b5bfb51a6
          tenant-id: c9e1671a-0acd-4412-ba55-018fc27d1f62
          subscription-id: 8fc57fc2-9cc4-4bcb-8c0f-315512d0cba3
   - name: login to acr
     run:  |
       az acr login --name $ACR_NAME
   - name: build docker image
     run :  |
       docker build -t $IMAGE_NAME:$IMAGE_TAG .
   - name: image tag
     run:  |
       docker tag $IMAGE_NAME:$IMAGE_TAG ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
   - name: image push
     run: |
       $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG
       
  
     
    
      
    
 
 

